server {
    listen 80;

    # Same shape as vite.config.ts's dev-server proxy: forward /api as-is to
    # the backend, so the browser only ever talks to this one origin and no
    # backend CORS configuration is needed (CLAUDE.md section 16).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: any other path serves index.html so React Router's
    # client-side routes (e.g. a direct load of /tasks/5/edit) resolve
    # correctly instead of nginx 404ing on a path with no matching file.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
